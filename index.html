<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我們走過的地方</title>
  <style>
    :root {
      --bg-1: #030712;
      --bg-2: #08101d;
      --panel: rgba(10, 16, 28, 0.86);
      --panel-border: rgba(255, 255, 255, 0.12);
      --text: #f5f7fb;
      --muted: #9fb0c9;
      --accent: #ff9f43;
      --accent-soft: rgba(255, 159, 67, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Avenir Next", "Trebuchet MS", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(57, 91, 160, 0.2), transparent 28%),
        radial-gradient(circle at bottom right, rgba(255, 159, 67, 0.08), transparent 22%),
        linear-gradient(180deg, var(--bg-2), var(--bg-1));
      color: var(--text);
    }

    #globeViz {
      width: 100vw;
      height: 100vh;
    }

    .overlay {
      position: fixed;
      top: 20px;
      left: 20px;
      width: min(340px, calc(100vw - 40px));
      max-height: calc(100vh - 40px);
      overflow-y: auto;
      padding: 18px;
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      background: var(--panel);
      backdrop-filter: blur(14px);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
      z-index: 10;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 28px;
      line-height: 1.1;
    }

    .intro {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .card {
      padding: 14px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .card-label {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .card h2 {
      margin: 0 0 8px;
      font-size: 20px;
    }

    .card p {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
      font-size: 14px;
    }

    .location-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .location-button {
      border: 1px solid rgba(255, 159, 67, 0.24);
      border-radius: 999px;
      padding: 8px 12px;
      background: var(--accent-soft);
      color: var(--text);
      cursor: pointer;
      font-size: 13px;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .location-button:hover {
      background: rgba(255, 159, 67, 0.28);
      transform: translateY(-1px);
    }

    .hint {
      margin-top: 14px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .trip-section {
      margin-bottom: 14px;
    }

    .trip-label {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .trip-list {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .trip-button {
      border: 1px solid var(--panel-border);
      border-radius: 999px;
      padding: 6px 12px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 12px;
      transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
      white-space: nowrap;
    }

    .trip-button:hover {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
    }

    .trip-button.active {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--text);
    }

    .trip-meta {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .year-group {
      width: 100%;
      margin-bottom: 4px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .year-label {
      display: block;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin: 8px 0 4px;
    }

    .year-label:first-child {
      margin-top: 0;
    }

    @media (max-width: 700px) {
      .overlay {
        top: auto;
        bottom: 16px;
        left: 16px;
        right: 16px;
        width: auto;
      }

      h1 {
        font-size: 24px;
      }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/globe.gl"></script>
</head>
<body>
  <div id="globeViz"></div>

  <aside class="overlay">
    <p class="eyebrow">屬於我們的旅行記憶</p>
    <h1>那些我們一起走過的地方</h1>
    <p class="intro">
      轉動地球，找找我們曾留下足跡的角落。移到標記點可以看到提示，點一下就能重回那段時光。
    </p>

    <div class="trip-section">
      <p class="trip-label" id="tripGroupLabel">旅程</p>
      <div id="tripList" class="trip-list" role="group" aria-labelledby="tripGroupLabel"></div>
    </div>

    <section class="card">
      <p class="card-label" id="tripTag">這一刻的回憶</p>
      <h2 id="locationName">點一個地方，想起那時的我們</h2>
      <p id="locationDescription">點一下地圖，看看我們當時的故事。</p>
    </section>

    <div id="locationList" class="location-list"></div>
  </aside>

  <script>
    // Trips data – each trip groups related locations together.
    const trips = [
      {
        id: "tokyo-2022",
        title: "東京之旅",
        dateRange: "2022.12.31 – 2023.01.05",
        year: 2022,
        description: "跨年東京之旅"
      },
      {
        id: "beijing-2024",
        title: "北京之旅",
        dateRange: "2024.08.01 – 2024.08.05",
        year: 2024,
        description: "北京夏日之旅"
      },
      {
        id: "shanghai-2024",
        title: "上海之旅",
        dateRange: "2024.11.30 – 2024.12.03",
        year: 2024,
        description: "上海冬日之旅"
      },
      {
        id: "europe-winter-2024",
        title: "歐洲冬日之旅",
        dateRange: "2024.12.29 – 2025.01.07",
        year: 2024,
        description: "布達佩斯、維也納、慕尼黑、薩爾茲堡"
      },
      {
        id: "middle-east-2025",
        title: "中東之旅",
        dateRange: "2025.05.27 – 2025.06.08",
        year: 2025,
        description: "杜拜、阿布達比、馬斯喀特、尼茲瓦"
      },
      {
        id: "shanghai-2026",
        title: "上海新年之旅",
        dateRange: "2026.01.01 – 2026.01.03",
        year: 2026,
        description: "上海新年之旅"
      },
      {
        id: "hk-shenzhen-2026",
        title: "香港・深圳之旅",
        dateRange: "2026.03.07 – 2026.03.09",
        year: 2026,
        description: "香港與深圳之旅"
      }
    ];

    // Real travel location data.
    const locations = [
      {
        name: "日本・東京",
        lat: 35.6762,
        lng: 139.6503,
        description: "跨年夜的煙火與新年的寧靜，東京的兩種面貌。",
        tripId: "tokyo-2022"
      },
      {
        name: "中國・北京",
        lat: 39.9042,
        lng: 116.4074,
        description: "故宮、胡同與夏日的蟬鳴，北京深厚的歷史氣息。",
        tripId: "beijing-2024"
      },
      {
        name: "中國・上海",
        lat: 31.2304,
        lng: 121.4737,
        description: "外灘夜景、石庫門弄堂，外灘的光與影。",
        tripId: "shanghai-2024"
      },
      {
        name: "匈牙利・布達佩斯",
        lat: 47.4979,
        lng: 19.0402,
        description: "多瑙河畔的燈火，歐洲最美的夜景之一。",
        tripId: "europe-winter-2024"
      },
      {
        name: "奧地利・維也納",
        lat: 48.2082,
        lng: 16.3738,
        description: "在音樂、咖啡館與跨年燈火中度過的冬日旅程。",
        tripId: "europe-winter-2024"
      },
      {
        name: "德國・慕尼黑",
        lat: 48.1351,
        lng: 11.5820,
        description: "冬日的瑪麗恩廣場與節日市集。",
        tripId: "europe-winter-2024"
      },
      {
        name: "奧地利・薩爾茲堡",
        lat: 47.8095,
        lng: 13.0550,
        description: "莫札特的故鄉，被雪覆蓋的古城輪廓。",
        tripId: "europe-winter-2024"
      },
      {
        name: "阿聯酋・杜拜",
        lat: 25.2048,
        lng: 55.2708,
        description: "沙漠中的未來城市，奢華與傳統並存。",
        tripId: "middle-east-2025"
      },
      {
        name: "阿聯酋・阿布達比",
        lat: 24.4539,
        lng: 54.3773,
        description: "謝赫扎耶德清真寺的白色穹頂在陽光下閃耀。",
        tripId: "middle-east-2025"
      },
      {
        name: "阿曼・馬斯喀特",
        lat: 23.5880,
        lng: 58.3829,
        description: "阿拉伯海邊的古都，傳統與現代的交匯。",
        tripId: "middle-east-2025"
      },
      {
        name: "阿曼・尼茲瓦",
        lat: 22.9340,
        lng: 57.5306,
        description: "千年古堡與傳統市集，阿曼的歷史心臟。",
        tripId: "middle-east-2025"
      },
      {
        name: "中國・上海",
        lat: 31.2304,
        lng: 121.4737,
        description: "新年第一天在外灘迎接2026年的到來。",
        tripId: "shanghai-2026"
      },
      {
        name: "香港",
        lat: 22.3193,
        lng: 114.1694,
        description: "維多利亞港的夜色，城市的喧囂與活力。",
        tripId: "hk-shenzhen-2026"
      },
      {
        name: "中國・深圳",
        lat: 22.5431,
        lng: 114.0579,
        description: "科技城市的脈動，與香港一河之隔的未來感。",
        tripId: "hk-shenzhen-2026"
      }
    ];

    const globeContainer = document.getElementById("globeViz");
    const locationName = document.getElementById("locationName");
    const locationDescription = document.getElementById("locationDescription");
    const locationList = document.getElementById("locationList");
    const tripListEl = document.getElementById("tripList");
    const tripTag = document.getElementById("tripTag");

    let activeTripId = null; // null means "all trips"

    function getTrip(tripId) {
      return trips.find((t) => t.id === tripId) || null;
    }

    function getFilteredLocations() {
      if (!activeTripId) return locations;
      return locations.filter((l) => l.tripId === activeTripId);
    }

    function showLocationInfo(location) {
      locationName.textContent = location.name;
      locationDescription.textContent = location.description;
      const trip = getTrip(location.tripId);
      tripTag.textContent = trip ? `${trip.title}・${trip.dateRange}` : "這一刻的回憶";
    }

    function focusLocation(location) {
      showLocationInfo(location);
      globe.pointOfView(
        { lat: location.lat, lng: location.lng, altitude: 1.8 },
        1200
      );
    }

    function renderLocationButtons() {
      locationList.innerHTML = "";
      getFilteredLocations().forEach((location) => {
        const button = document.createElement("button");
        button.className = "location-button";
        button.textContent = location.name;
        button.addEventListener("click", () => focusLocation(location));
        locationList.appendChild(button);
      });
    }

    function applyTripFilter(tripId) {
      activeTripId = tripId;

      // Update globe points
      globe.pointsData(getFilteredLocations());

      // Update location buttons
      renderLocationButtons();

      // Update trip button styles
      tripListEl.querySelectorAll(".trip-button").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.tripId === (tripId === null ? "" : tripId));
      });

      // Reset detail card
      const filtered = getFilteredLocations();
      if (filtered.length > 0) {
        showLocationInfo(filtered[0]);
        globe.pointOfView({ lat: filtered[0].lat, lng: filtered[0].lng, altitude: 2.3 }, 1000);
      } else {
        locationName.textContent = "點一個地方，想起那時的我們";
        locationDescription.textContent = "點一下地圖，看看我們當時的故事。";
        tripTag.textContent = "這一刻的回憶";
      }
    }

    function createTripButtons() {
      // "All" button
      const allBtn = document.createElement("button");
      allBtn.className = "trip-button active";
      allBtn.textContent = "全部旅程";
      allBtn.dataset.tripId = "";
      allBtn.addEventListener("click", () => applyTripFilter(null));
      tripListEl.appendChild(allBtn);

      // Group trips by year
      const years = [...new Set(trips.map((t) => t.year))].sort((a, b) => a - b);
      years.forEach((year) => {
        const group = document.createElement("div");
        group.className = "year-group";

        const yearLabel = document.createElement("span");
        yearLabel.className = "year-label";
        yearLabel.textContent = year;
        group.appendChild(yearLabel);

        trips.filter((t) => t.year === year).forEach((trip) => {
          const btn = document.createElement("button");
          btn.className = "trip-button";
          btn.textContent = trip.title;
          btn.dataset.tripId = trip.id;
          btn.title = `${trip.dateRange} — ${trip.description}`;
          btn.addEventListener("click", () => applyTripFilter(trip.id));
          group.appendChild(btn);
        });

        tripListEl.appendChild(group);
      });
    }

    const globe = new Globe(globeContainer)
      .globeImageUrl("https://unpkg.com/three-globe/example/img/earth-dark.jpg")
      .backgroundColor("#030712")
      .showAtmosphere(true)
      .atmosphereColor("#4ea1ff")
      .atmosphereAltitude(0.14)
      .pointsData(locations)
      .pointLat("lat")
      .pointLng("lng")
      .pointAltitude(0.03)
      .pointRadius(0.35)
      .pointColor(() => "#ff9f43")
      .pointLabel((location) => `
        <div style="padding: 6px 8px;">
          <strong>${location.name}</strong><br>
          <span>${location.description}</span>
        </div>
      `)
      .onPointClick((location) => {
        focusLocation(location);
      });

    globe.pointOfView({ lat: 20, lng: 10, altitude: 2.3 });

    const controls = globe.controls();
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.5;
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;

    createTripButtons();
    renderLocationButtons();
    showLocationInfo(locations[0]);

    window.addEventListener("resize", () => {
      globe.width(window.innerWidth).height(window.innerHeight);
    });
  </script>
</body>
</html>
